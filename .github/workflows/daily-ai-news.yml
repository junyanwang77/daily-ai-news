name: Daily AI News

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Legacy input; generation now runs locally with ChatGPT subscription
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  subscription-migration-notice:
    runs-on: ubuntu-latest
    steps:
      - name: Report local subscription scheduler
        run: |
          echo 'Generation has moved to the local Mac scheduler using Codex ChatGPT login.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This workflow makes no model or API calls. GitHub Pages still deploys on push.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Run python3 scripts/subscription_daily.py --status on the Mac to inspect production.' >> "$GITHUB_STEP_SUMMARY"
