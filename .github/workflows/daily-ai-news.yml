name: Daily AI News

on:
  workflow_dispatch: {}    # 由 cron-job.org 每天北京时间 08:40 调用 API 触发，GitHub 自带 schedule 延迟不可靠，已弃用

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's briefing already exists
        id: today
        run: |
          today="$(date +%F)"
          echo "date=$today" >> "$GITHUB_OUTPUT"

          if [ -f "archive/${today:0:7}/daily-ai-briefing-${today}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's briefing already exists: $today"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.today.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: steps.today.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate today's briefing
        if: steps.today.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          BRIEFING_DATE: ${{ steps.today.outputs.date }}
        # 规格通过 --append-system-prompt-file 传入，而不是作为 -p 的位置参数。
        # 把 17KB 的规格当 -p 参数传时，CLI 会间歇性地整段丢掉它（模型只收到项目
        # 上下文，回复“没看到具体请求”后 0 退出码结束，一个文件都不写），
        # 2026-08-08 和 2026-08-10 两次失败都是这个原因。
        run: |
          md="daily-ai-briefing-${BRIEFING_DATE}.md"

          for attempt in 1 2 3; do
            echo "::group::Generation attempt ${attempt}"
            claude -p "现在开始执行《每日 AI 要闻》生成任务：生成 ${BRIEFING_DATE} 的 Markdown 简报，并按规格用 make_html.py 生成对应的手机版 HTML。" \
              --append-system-prompt-file prompts/daily_ai_briefing.md \
              --output-format text \
              --model sonnet \
              --permission-mode bypassPermissions \
              --fallback-model haiku \
              --allowedTools "Read,Write,Bash,WebSearch,WebFetch" || true
            echo "::endgroup::"

            if [ -f "$md" ]; then
              echo "Generated ${md} on attempt ${attempt}."
              exit 0
            fi
            echo "Attempt ${attempt} produced no ${md}."
          done

          echo "::error::Claude produced no ${md} after 3 attempts."
          exit 1

      - name: Validate generated briefing
        if: steps.today.outputs.skip != 'true'
        run: |
          python3 validate_briefing.py "${{ steps.today.outputs.date }}"

      - name: Publish (update latest + commit + push)
        if: steps.today.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name "daily-ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          bash ./publish.sh "${{ steps.today.outputs.date }}"
