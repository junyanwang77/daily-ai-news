name: Daily AI News

on:
  schedule:
    - cron: '15 1 * * *'  # UTC 01:15 = 北京时间 09:15
    - cron: '15 2 * * *'  # UTC 02:15 = 北京时间 10:15，作为备用触发
  workflow_dispatch: {}    # 支持手动触发，方便调试

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - name: Check whether today's briefing already exists
        id: today
        run: |
          today="$(date +%F)"
          echo "date=$today" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ -f "archive/${today:0:7}/daily-ai-briefing-${today}.md" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Today's briefing already exists: $today"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.today.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        if: steps.today.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate today's briefing
        if: steps.today.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude -p "$(cat prompts/daily_ai_briefing.md)" \
            --output-format text \
            --model sonnet \
            --permission-mode bypassPermissions \
            --max-budget-usd 2 \
            --fallback-model haiku \
            --allowedTools "Read,Write,Bash,WebSearch,WebFetch"

      - name: Publish (update latest + commit + push)
        if: steps.today.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name "daily-ai-news-bot"
          git config user.email "actions@users.noreply.github.com"
          bash ./publish.sh
